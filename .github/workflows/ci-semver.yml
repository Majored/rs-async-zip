name: semver-checks (Linux)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Run cargo-semver-checks
      uses: obi1kenobi/cargo-semver-checks-action@v2
      with:
        feature-group: all-features
        # Cargo treats every 0.0.x -> 0.0.y bump as a major (breaking) release, so
        # cargo-semver-checks would otherwise skip all of its lints. Force it to hold
        # the API to minor-release rules and report breakage regardless of the bump.
        release-type: minor
